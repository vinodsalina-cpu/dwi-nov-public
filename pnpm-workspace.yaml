# The native-runtime staging script reads the target binaries from this tree.
nodeLinker: hoisted
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  '@vscode/vsce-sign': false
  esbuild: false
  onnxruntime-node: false
overrides:
  'harper.js@3.3.0': 'file:vendor/harper.js-3.3.0.tgz'
  'onnxruntime-node>adm-zip': 0.6.1
  '@vscode/vsce>minimatch': 11.0.9
# Node 22 types require these November 2024 declarations, which lack a provenance attestation.
trustPolicyExclude:
  - undici-types@6.21.0
